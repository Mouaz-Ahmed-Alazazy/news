<!Doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>{% block title %}Newspaper{% endblock title %}</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}">Newspaper</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
                        </li>
                        {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link px-2 link-dark" href="{% url 'article_new'%}">+New</a>
                        </li>
                    </ul>
                    <div class="mr-auto">
                        <ul class="navbar-nav">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">{{ user.username }}</a>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="{% url 'password_change' %}">Change Password</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <form method="post" action="{% url 'logout' %}" style="display: inline;">
                                            {% csrf_token %}
                                            <button type="submit" class="btn btn-link nav-link" style="display: inline; cursor: pointer;">Logout</button>
                                        </form>
                                    </li>
                                </ul>
                            </li>
                            {% else %}
                        </ul>
                    </div>
                    <div class="mr-auto">
                        <form class="form d-flex">
                            <a href="{% url 'login' %}" class="btn btn-outline-secondary">Login</a>
                            <a href="{% url 'signup' %}" class="btn btn-primary ms-2">Sign Up</a>
                        </form>
                    </div>
                    {% endif %}
                </div>
            </div>
        </nav>


        <main>
            <div class="container">
                {% block content %}
                {% endblock content %}
            </div>
        </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    </body>
</html>
